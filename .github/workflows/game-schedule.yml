name: Railway Game Schedule

on:
  schedule:
    # 毎日 20:00 JST (11:00 UTC) 起動
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway deploy
        run: |
          curl -s -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            --fail
        timeout-minutes: 2
