name: ショート動画生成

# Actionsタブ → このワークフロー → 「Run workflow」で手動実行。
# または run-video/ で始まるブランチをpushしても起動する
# (API経由でworkflow_dispatchを叩けない連携ツール用の入口)。
# 完了後、実行結果ページの Artifacts から keiba-shorts をダウンロード。
on:
  workflow_dispatch:
  push:
    branches: ["run-video/**"]

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIDEO_OUT: ${{ github.workspace }}/video_out
    steps:
      - uses: actions/checkout@v4

      - name: システム依存パッケージ
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk p7zip-full psmisc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python依存パッケージ + Chromium
        run: |
          pip install playwright websockets numpy
          pip install -r backend/requirements.txt
          python -m playwright install --with-deps chromium

      - name: VOICEVOXエンジンのキャッシュ
        id: vvcache
        uses: actions/cache@v4
        with:
          path: linux-cpu-x64
          key: voicevox-engine-0.25.2

      - name: VOICEVOXエンジン取得(初回のみ・約1.8GB)
        if: steps.vvcache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o vv.7z https://github.com/VOICEVOX/voicevox_engine/releases/download/0.25.2/voicevox_engine-linux-cpu-x64-0.25.2.7z.001
          7z x vv.7z
          rm vv.7z

      - name: ショート動画 + タイトル・説明文を生成
        run: |
          chmod +x linux-cpu-x64/run video_tools/run_pipeline.sh
          VOICEVOX_RUN=./linux-cpu-x64/run ./video_tools/run_pipeline.sh

      - name: タイトル・説明文を実行ページに表示
        # 実行結果ページの Summary にそのまま表示され、コピペできる
        run: cat "$VIDEO_OUT/metadata.md" >> "$GITHUB_STEP_SUMMARY"

      - name: 動画とメタデータをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: keiba-shorts
          path: |
            ${{ github.workspace }}/video_out/keiba_shorts.mp4
            ${{ github.workspace }}/video_out/metadata.md

      - name: 失敗時のログ
        if: failure()
        run: tail -n 50 ${{ env.VIDEO_OUT }}/*.log || true
