services:
  - type: web
    name: gamekeiba-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      # 所持金の保存先（Neon などの Postgres）。未設定だと再起動のたびに所持金が消える
      - key: DATABASE_URL
        sync: false
